name: procureagent-release-gates

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Default CI: fully offline. No paid LLM, no real suppliers, no purchases,
  # no external private accounts, no production credentials.
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # fastapi pins starlette<0.47 but mcp 2.3.0 needs 0.52.1 (Route API
          # bug). Install order mirrors the local venv: override starlette
          # with --no-deps AFTER fastapi, then install mcp (its
          # starlette>=0.27 requirement is already satisfied by 0.52.1).
          pip install --no-deps starlette==0.52.1
          pip install mcp==2.3.0

      - name: Ruff
        run: ruff check app/ tests/

      - name: Core safety regression suite
        # The release-gate critical tests (fast, offline, cross-platform).
        # Single-line file list — YAML block scalars preserve leading
        # whitespace, so backslash line-continuation with indentation
        # produces file names with leading spaces ("file not found").
        shell: bash -o pipefail {0}
        run: python -m pytest tests/test_phase10_mcp_gateway.py tests/test_phase10_evalops.py tests/test_phase10_otel.py tests/test_phase10_otel_integration.py tests/test_phase11a_correctness.py tests/test_phase11a_otel.py tests/test_phase11b_mutation.py tests/test_phase11b_authz_e2e.py tests/test_phase11b_observatory.py -q 2>&1 | tee pytest_output.txt

      - name: Release gate evaluation (unsafe candidate must be REJECTED)
        run: |
          python -m app.evalops.unsafe_candidate_demo
          python -c "import json; r=json.load(open('docs/eval/release_gate_results.json')); unsafe=r['unsafe_candidate']['summary']; assert unsafe['verdict']=='REJECTED', 'unsafe candidate must be rejected'; assert 'hard_budget_violation' in unsafe['failed_gates']; print('OK: unsafe candidate blocked by release gate')"

      - name: Machine-readable results
        run: |
          python -c "import json; d={'date':'ci-run','gate_verdict':json.load(open('docs/eval/release_gate_results.json'))['unsafe_candidate']['summary']['verdict']}; json.dump(d, open('docs/eval/ci_artifacts.json','w'), indent=2)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            docs/eval/*.json
            pytest_output.txt

  # Long Chromium benchmark: separate job, explicit scope. The Release Gate
  # verdict is NOT claimed when this job has not run.
  browser-benchmark:
    runs-on: ubuntu-latest
    needs: [offline-gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + playwright
        run: |
          pip install -r requirements.txt
          # same starlette/mcp override as offline-gates (fastapi pins
          # starlette<0.47 but mcp 2.3.0 needs 0.52.1)
          pip install --no-deps starlette==0.52.1
          pip install mcp==2.3.0
          python -m playwright install chromium --with-deps || true
      - name: Workbench browser E2E (real Chromium)
        run: python -m pytest tests/test_phase9_workbench_e2e.py -q
